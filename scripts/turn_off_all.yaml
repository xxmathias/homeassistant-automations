turn_off_all:
  alias: Turn Off All
  description: Turn off all lights and switches in all areas
  sequence:
    - action: light.turn_off
      target:
        area_id:
          - schlafzimmer
          - durchgangszimmer
          - entrance
          - kueche
          - wohnzimmer
      data:
        transition: 2
    # kueche omitted on purpose — no switch-driven lamp there, only the Kitchen
    # Adaptive Lighting switches, which this must not disable.
    - action: switch.turn_off
      target:
        area_id:
          - schlafzimmer
          - durchgangszimmer
          - entrance
    # Wohnzimmer switches listed explicitly to avoid turning off Yamaha boxes
    - action: switch.turn_off
      target:
        entity_id: switch.desklamp
  mode: single
