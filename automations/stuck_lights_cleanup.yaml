# Stuck Lights Cleanup Automation
#
# Safety net for lights that got stuck on due to automation failures or edge cases.
#
# Runs day AND night (every 5 min). The old night exclusion was removed: it
# disabled this safety net exactly when the 22:30-boundary stuck-light bug happens
# (a light whose presence cleared just before 22:30 never gets a night transition).
# It only ever turns lights OFF after 10 min of no presence, so it can't fight the
# night pathway lighting (which only persists while there is motion/presence).
#
# Turns off any light that:
#   - Has no presence/motion detected for 10+ minutes
#   - Any brightness (presence has been clear 10+ min, so a manual level is moot)
#
id: stuck_lights_cleanup
alias: Stuck Lights Cleanup
description: Turn off lights stuck on (any brightness) with no presence
triggers:
  - trigger: time_pattern
    minutes: "/5"
conditions:
  - condition: state
    entity_id: input_boolean.keep_lights_on
    state: "off"
actions:
  # Check and fix entrance (no presence sensor, check both motion sensors)
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.bewegungssensor1_occupancy
            state: "off"
            for:
              minutes: 10
          - condition: state
            entity_id: binary_sensor.bewegungssensor2_licht_occupancy
            state: "off"
            for:
              minutes: 10
          - condition: state
            entity_id: light.entrance
            state: "on"
        sequence:
          - service: light.turn_off
            target:
              area_id: entrance
            data:
              transition: 3
  # Check and fix kitchen
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor_presence
            state: "off"
            for:
              minutes: 10
          - condition: state
            entity_id: light.kuchenlampe
            state: "on"
        sequence:
          - service: light.turn_off
            target:
              entity_id: light.kuchenlampe
            data:
              transition: 3
  # Check and fix durchgangszimmer
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor2_presence
            state: "off"
            for:
              minutes: 10
          - condition: state
            entity_id: binary_sensor.bewegungssensor2_licht_occupancy
            state: "off"
            for:
              minutes: 10
          - condition: or
            conditions:
              - condition: state
                entity_id: light.durchgangszimmer1
                state: "on"
              - condition: state
                entity_id: light.durchgangszimmer2
                state: "on"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: switch.afrika_stehlampe
          - service: light.turn_off
            target:
              entity_id:
                - light.durchgangszimmer1
                - light.durchgangszimmer2
            data:
              transition: 3
  # Check and fix wohnzimmer
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor3_presence
            state: "off"
            for:
              minutes: 10
          # Respect a hand-set brightness hold (released at 2h, see wohnzimmer_manual_override)
          - condition: state
            entity_id: input_boolean.wohnzimmer_keep_on
            state: "off"
          - condition: or
            conditions:
              - condition: state
                entity_id: light.wohnzimmerlampe
                state: "on"
              - condition: state
                entity_id: light.vintage_lampe
                state: "on"
              - condition: state
                entity_id: light.stehlampe
                state: "on"
              - condition: state
                entity_id: switch.desklamp
                state: "on"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: switch.desklamp
          - service: light.turn_off
            target:
              entity_id:
                - light.wohnzimmerlampe
                - light.vintage_lampe
                - light.stehlampe
            data:
              transition: 3
mode: single
