# Wohnzimmer Manual Override
#
# Lets a hand-set brightness "stick": touching any wohnzimmer light flips
# input_boolean.wohnzimmer_keep_on, which pauses the presence-based reset and
# turn-off in wohnzimmer_on_presence.yaml + stuck_lights_cleanup.yaml. Without
# this, praesenzsensor3 drops presence when you sit still (it struggles with
# stationary detection beyond ~3m, see SETUP.md), so the automation snaps your
# light back to the night level or turns it off.
#
# The hold is released when:
#   - the room goes fully dark (all 3 lights off, by any means), or
#   - presence has been gone for 2 hours (then it also turns the room off).
#
# REQUIRES helper: input_boolean.wohnzimmer_keep_on
#   (Settings -> Devices & Services -> Helpers -> Create -> Toggle)
#
id: wohnzimmer_manual_override
alias: Wohnzimmer manual override
description: Hold hand-set wohnzimmer brightness against presence-based reset/turn-off
triggers:
  # Any change to a wohnzimmer light (used to detect manual touches + full-off)
  - entity_id:
      - light.wohnzimmerlampe
      - light.vintage_lampe
      - light.stehlampe
    trigger: state
    id: light_change
  # Presence gone long enough that the manual hold should be released
  - entity_id: binary_sensor.praesenzsensor3_presence
    to: "off"
    for:
      hours: 2
    trigger: state
    id: release
conditions: []
actions:
  - choose:
      # Manual (human-initiated) on/brightness change -> engage the hold.
      # Only frontend/app/voice calls carry a user_id; automation service
      # calls (presence, daylight, stuck-lights) have user_id == none, so this
      # never fires on our own light.turn_on actions.
      - conditions:
          - condition: trigger
            id: light_change
          - condition: template
            value_template: >
              {{ trigger.to_state.state == 'on'
                 and trigger.to_state.context.user_id is not none }}
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.wohnzimmer_keep_on
      # Room fully dark (any cause) -> release the hold so the next presence
      # cycle behaves normally again.
      - conditions:
          - condition: trigger
            id: light_change
          - condition: state
            entity_id: light.wohnzimmerlampe
            state: "off"
          - condition: state
            entity_id: light.vintage_lampe
            state: "off"
          - condition: state
            entity_id: light.stehlampe
            state: "off"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.wohnzimmer_keep_on
      # Presence gone 2h -> release the hold and turn the room off.
      - conditions:
          - condition: trigger
            id: release
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.wohnzimmer_keep_on
          - service: switch.turn_off
            target:
              entity_id: switch.desklamp
          - service: light.turn_off
            target:
              entity_id:
                - light.wohnzimmerlampe
                - light.vintage_lampe
                - light.stehlampe
            data:
              transition: 3
mode: queued
