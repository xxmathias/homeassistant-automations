id: night_pathway_mode
alias: Night Pathway Mode
description: Minimal pathway lighting when living room is off and motion detected at entrance
triggers:
  - entity_id: binary_sensor.bewegungssensor2_licht_occupancy
    to: "on"
    trigger: state
    id: motion_on
  - entity_id: binary_sensor.bewegungssensor2_licht_occupancy
    to: "off"
    trigger: state
    id: motion_off
  # Turn on durchgangszimmer when presence detected (e.g. entering from wohnzimmer)
  - entity_id: binary_sensor.praesenzsensor2_presence
    to: "on"
    trigger: state
    id: presence_on
  # Turn off durchgangszimmer lights + stehlampe when presence clears
  - entity_id: binary_sensor.praesenzsensor2_presence
    to: "off"
    for:
      minutes: 1
    trigger: state
    id: presence_off
conditions:
  # Night mode: 22:30-07:00
  - condition: time
    after: "22:30:00"
    before: "07:00:00"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          # Turn on entrance at 50%
          - service: light.turn_on
            target:
              area_id: entrance
            data:
              transition: 3
              brightness_pct: 50
              color_temp_kelvin: 2700 # Warm light for night
          # Turn on durchgangszimmer at 20% only if no presence
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor2_presence
                    state: "off"
                sequence:
                  # Lamp2 first, then lamp1 1s later (sequential)
                  - service: light.turn_on
                    target:
                      entity_id: light.durchgangszimmer2
                    data:
                      transition: 1
                      brightness_pct: 20
                      color_temp_kelvin: 2700
                  - delay:
                      seconds: 1
                  - service: light.turn_on
                    target:
                      entity_id: light.durchgangszimmer1
                    data:
                      transition: 1
                      brightness_pct: 20
                      color_temp_kelvin: 2700
          # Turn on kitchen at 30% only if no presence
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor_presence
                    state: "off"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: light.kuchenlampe
                    data:
                      transition: 3
                      brightness_pct: 30
                      color_temp_kelvin: 2700
      # Presence detected in durchgangszimmer (e.g. entering from wohnzimmer)
      - conditions:
          - condition: trigger
            id: presence_on
        sequence:
          # Lamp2 first, then lamp1 1s later (sequential)
          - service: light.turn_on
            target:
              entity_id: light.durchgangszimmer2
            data:
              transition: 1
              brightness_pct: 20
              color_temp_kelvin: 2700
          - delay:
              seconds: 1
          - service: light.turn_on
            target:
              entity_id: light.durchgangszimmer1
            data:
              transition: 1
              brightness_pct: 20
              color_temp_kelvin: 2700
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: state
            entity_id: input_boolean.keep_lights_on
            state: "off"
        sequence:
          # Wait 1 minute before turning off
          - delay:
              minutes: 1
          # Check if still no motion in entrance
          - condition: state
            entity_id: binary_sensor.bewegungssensor2_licht_occupancy
            state: "off"
          # Turn off entrance
          - service: light.turn_off
            target:
              area_id: entrance
            data:
              transition: 3
          # Turn off durchgangszimmer + stehlampe if no presence
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor2_presence
                    state: "off"
                    for:
                      minutes: 1
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: switch.afrika_stehlampe
                  # Turn off sequentially: lamp1 then lamp2 1s later
                  - service: light.turn_off
                    target:
                      entity_id: light.durchgangszimmer1
                    data:
                      transition: 1
                  - delay:
                      seconds: 1
                  - service: light.turn_off
                    target:
                      entity_id: light.durchgangszimmer2
                    data:
                      transition: 1
          # Turn off kitchen if no presence
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor_presence
                    state: "off"
                    for:
                      minutes: 2
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id: light.kuchenlampe
                    data:
                      transition: 3
      # Durchgangszimmer presence off for 2+ minutes - dim→off
      - conditions:
          - condition: trigger
            id: presence_off
          - condition: state
            entity_id: input_boolean.keep_lights_on
            state: "off"
        sequence:
          - condition: state
            entity_id: binary_sensor.praesenzsensor2_presence
            state: "off"
          # Turn off stehlampe + durchgangszimmer
          - service: switch.turn_off
            target:
              entity_id: switch.afrika_stehlampe
          # Turn off sequentially: lamp1 then lamp2 1s later
          - service: light.turn_off
            target:
              entity_id: light.durchgangszimmer1
            data:
              transition: 1
          - delay:
              seconds: 1
          - service: light.turn_off
            target:
              entity_id: light.durchgangszimmer2
            data:
              transition: 1
mode: restart
