alias: Tuya Zigbee 4 button remote
description: "Controls various lights in the bedroom area"
use_blueprint:
  path: Soulfly999/tuya-4-button-remote-switch-ts0044-1-zigbee2mqtt.yaml
  input:
    button_1_short_press:
      - action: light.toggle
        metadata: {}
        data:
          transition: 3
        target:
          device_id: eefddc4491452c82bb3e629a92e02e79
    button_2_short_press:
      - action: switch.toggle
        metadata: {}
        data: {}
        target:
          entity_id: switch.rgb_plug
    button_3_short_press:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          device_id: 45dcd00e46b1d70ee57ba860bebc4af8
    button_4_short_press:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 3
        target:
          area_id:
            - schlafzimmer
            - wohnzimmer
            - durchgangszimmer
            - kueche
            - entrance
      # kueche omitted on purpose — no switch-driven lamp there, only the Kitchen
      # Adaptive Lighting switches, which this must not disable.
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          area_id:
            - schlafzimmer
            - wohnzimmer
            - durchgangszimmer
            - entrance
    switch: sensor.tuya_mobil_action
