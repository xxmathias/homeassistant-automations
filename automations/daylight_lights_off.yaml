# Daylight Lights Off
#
# When natural daylight is sufficient (>50 lux for 5 minutes),
# turn off all lights to save energy.
#
# The wohnzimmer is exempt while input_boolean.wohnzimmer_keep_on is on — a
# hand-set brightness wins over the daylight sweep (see wohnzimmer_manual_override).
#
id: daylight_lights_off
alias: Daylight Lights Off
description: Turn off all lights when bright for 5 minutes
triggers:
  - entity_id: sensor.bewegungssensor2_licht_illuminance
    above: 50
    for:
      minutes: 5
    trigger: numeric_state
conditions:
  - condition: state
    entity_id: input_boolean.keep_lights_on
    state: "off"
  - condition: not
    conditions:
      - condition: time
        after: "22:30:00"
        before: "07:00:00"
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 3
actions:
  # Skip durchgangszimmer: it's the dark hallway, global daylight sensor doesn't represent it
  - service: light.turn_off
    target:
      area_id:
        - schlafzimmer
        - entrance
        - kueche
    data:
      transition: 2
  # kueche deliberately NOT in this switch sweep: the area holds no switch-driven
  # lamp, only the Kitchen Adaptive Lighting switches (and praesenzsensor config).
  # Sweeping it would silently disable Adaptive Lighting. Same spirit as the
  # explicit wohnzimmer switch list in script.turn_off_all (Yamaha boxes).
  - service: switch.turn_off
    target:
      area_id:
        - schlafzimmer
        - entrance
  # Wohnzimmer: skip entirely while a hand-set brightness is being held
  # (see wohnzimmer_manual_override). Without this, a partly cloudy day re-crosses
  # the 50-lux threshold and stomps a level you just set by hand.
  - if:
      - condition: state
        entity_id: input_boolean.wohnzimmer_keep_on
        state: "off"
    then:
      - service: light.turn_off
        target:
          area_id: wohnzimmer
        data:
          transition: 2
      # Desklamp follows presence: keep it on as a task light while the wohnzimmer is
      # occupied (daylight makes the ceiling lights redundant, but not the desk lamp),
      # but turn it off when the room is empty — otherwise daylight-off strands it on.
      - if:
          - condition: state
            entity_id: binary_sensor.praesenzsensor3_presence
            state: "off"
        then:
          - service: switch.turn_off
            target:
              entity_id: switch.desklamp
mode: single
