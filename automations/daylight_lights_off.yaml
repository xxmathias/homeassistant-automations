# Daylight Lights Off
#
# When natural daylight is sufficient (>50 lux for 5 minutes),
# turn off all lights to save energy.
#
id: daylight_lights_off
alias: Daylight Lights Off
description: Turn off all lights when bright for 5 minutes
triggers:
  - entity_id: sensor.bewegungssensor2_licht_illuminance
    above: 50
    for:
      minutes: 5
    trigger: numeric_state
conditions:
  - condition: state
    entity_id: input_boolean.keep_lights_on
    state: "off"
  - condition: not
    conditions:
      - condition: time
        after: "22:30:00"
        before: "07:00:00"
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: 3
actions:
  # Skip durchgangszimmer: it's the dark hallway, global daylight sensor doesn't represent it
  - service: light.turn_off
    target:
      area_id:
        - schlafzimmer
        - entrance
        - kuche
        - wohnzimmer
    data:
      transition: 2
  - service: switch.turn_off
    target:
      area_id:
        - schlafzimmer
        - entrance
        - kuche
  - service: switch.turn_off
    target:
      entity_id: switch.desklamp
mode: single
