# Kueche Presence Automation
#
# Sensors:
#   - binary_sensor.praesenzsensor_presence (presence detection)
#   - sensor.bewegungssensor2_licht_illuminance (global light level check)
#
# Lights: light.kuchenlampe + light.billy_tischleuchte (moved into the kueche area,
# mirrors the kuchenlampe at every level — full, pathway and shutdown)
#
# Behavior:
#   Presence detected:
#     - Turn on at 100% day / 60% night (22:30-07:00) (when illuminance < 40 lux or sun elevation < 3°, or light at pathway brightness)
#     - Boost any pathway brightness (50% day / 20% night) to full level (100% day / 60% night) when presence turns on
#
#   Presence lost:
#     - Night (22:30-07:00): 2min grace → off
#     - Day: 4min grace → dim to 50% → off
#
id: kitchen_on_presence
alias: Kitchen on presence
triggers:
  - entity_id: binary_sensor.praesenzsensor_presence
    to: "on"
    id: an
    trigger: state
  - entity_id:
      - binary_sensor.praesenzsensor_presence
    to: "off"
    for:
      minutes: 2
    id: aus
    trigger: state
conditions:
  - condition: or
    conditions:
      # Always allow off trigger through (lights must turn off regardless of sun)
      - condition: trigger
        id: aus
      # Allow presence trigger when either kitchen light is already on below full
      # brightness (boost needed). Covers any pathway level (50% day, 20% night)
      # and mid-transition values; only skips when both are already near full so
      # an active boost isn't re-triggered.
      - condition: and
        conditions:
          - condition: trigger
            id: an
          - condition: template
            value_template: >
              {% set k = state_attr('light.kuchenlampe', 'brightness')|default(255)|int %}
              {% set b = state_attr('light.billy_tischleuchte', 'brightness')|default(255)|int %}
              {{ (is_state('light.kuchenlampe', 'on') and (k / 255 * 100)|round(0) < 95)
                 or (is_state('light.billy_tischleuchte', 'on') and (b / 255 * 100)|round(0) < 95) }}
      # Normal: turn on when dark (kitchen uses 40 lux — more eager than the 30-lux default)
      - condition: and
        conditions:
          - condition: trigger
            id: an
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.bewegungssensor2_licht_illuminance
                below: 40
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                below: 3
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: an
        sequence:
          # Night (22:30-07:00): cap at 60%. Day: full brightness.
          - variables:
              kitchen_pct: >
                {% set t = now().strftime('%H:%M') %}
                {{ 60 if (t >= '22:30' or t < '07:00') else 100 }}
          # Billy first, kuchenlampe 1s later (sequential — the warm table lamp
          # leads, the ceiling light follows)
          - service: light.turn_on
            target:
              entity_id: light.billy_tischleuchte
            data:
              brightness_pct: "{{ kitchen_pct }}"
              transition: 3
          - delay:
              seconds: 1
          - service: light.turn_on
            target:
              entity_id: light.kuchenlampe
            data:
              brightness_pct: "{{ kitchen_pct }}"
              transition: 3
      - conditions:
          - condition: trigger
            id: aus
          - condition: state
            entity_id: input_boolean.keep_lights_on
            state: "off"
        sequence:
          # Sensor has been off for 2+ minutes (handled by trigger `for`)
          # Confirm still off, then start shutdown
          - condition: state
            entity_id: binary_sensor.praesenzsensor_presence
            state: "off"
          # Skip shutdown if both kitchen lights are already off
          - condition: or
            conditions:
              - condition: state
                entity_id: light.kuchenlampe
                state: "on"
              - condition: state
                entity_id: light.billy_tischleuchte
                state: "on"
          # Night: just turn off. Day: extra delay + dim→off.
          - choose:
              - conditions:
                  - condition: time
                    after: "22:30:00"
                    before: "07:00:00"
                sequence:
                  # Ceiling light off first, billy 1s later
                  - service: light.turn_off
                    target:
                      entity_id: light.kuchenlampe
                    data:
                      transition: 3
                  - delay:
                      seconds: 1
                  - service: light.turn_off
                    target:
                      entity_id: light.billy_tischleuchte
                    data:
                      transition: 3
            default:
              - delay:
                  minutes: 2
              - condition: state
                entity_id: binary_sensor.praesenzsensor_presence
                state: "off"
              # Dim to 50%
              - service: light.turn_on
                target:
                  entity_id:
                    - light.kuchenlampe
                    - light.billy_tischleuchte
                data:
                  brightness_pct: 50
                  transition: 3
              - delay:
                  seconds: 30
              - condition: state
                entity_id: binary_sensor.praesenzsensor_presence
                state: "off"
              # Turn off: ceiling light first, billy 1s later
              - service: light.turn_off
                target:
                  entity_id: light.kuchenlampe
                data:
                  transition: 3
              - delay:
                  seconds: 1
              - service: light.turn_off
                target:
                  entity_id: light.billy_tischleuchte
                data:
                  transition: 3
mode: restart
