# Daylight Lights On
#
# When it gets dark again (illuminance drops below 30 lux),
# turn on lights in occupied rooms.
#
id: daylight_lights_on
alias: Daylight Lights On
description: Turn on lights in occupied rooms when it gets dark again
triggers:
  - entity_id: sensor.bewegungssensor2_licht_illuminance
    below: 30
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sun.sun
    attribute: elevation
    below: 3
    trigger: numeric_state
conditions:
  - condition: state
    entity_id: input_boolean.keep_lights_on
    state: "off"
  - condition: not
    conditions:
      - condition: time
        after: "22:30:00"
        before: "07:00:00"
actions:
  # Wohnzimmer: if occupied, turn on lights
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor3_presence
            state: "on"
          # Don't stomp a hand-set brightness (see wohnzimmer_manual_override)
          - condition: state
            entity_id: input_boolean.wohnzimmer_keep_on
            state: "off"
          # Wohnzimmer keeps the global < 30 lux turn-on (do NOT lower it — 20 was
          # tried and reverted). Only the sun fallback is tightened: -2° instead of
          # 0°, because right at the horizon it is still bright at the windows.
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.bewegungssensor2_licht_illuminance
                below: 30
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                below: -2
        sequence:
          - service: light.turn_on
            target:
              entity_id: light.wohnzimmerlampe
            data:
              brightness_pct: 100
              transition: 3
          - service: light.turn_on
            target:
              entity_id:
                - light.vintage_lampe
                - light.stehlampe
            data:
              brightness_pct: 40
              transition: 3
  # Küche: if occupied, turn on light
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor_presence
            state: "on"
          # Same gate as the wohnzimmer. Without it this branch fired on the bare
          # sun < 3° trigger and lit the kitchen while it was still bright.
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.bewegungssensor2_licht_illuminance
                below: 30
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                below: 0
        sequence:
          # Billy first, kuchenlampe 1s later
          - service: light.turn_on
            target:
              entity_id: light.billy_tischleuchte
            data:
              brightness_pct: 100
              transition: 3
          - delay:
              seconds: 1
          - service: light.turn_on
            target:
              entity_id: light.kuchenlampe
            data:
              brightness_pct: 100
              transition: 3
  # Durchgangszimmer: if occupied, turn on lights (darker room — left at the global
  # threshold, not the tighter wohnzimmer 20/0 gate)
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor2_presence
            state: "on"
          # Don't stomp a hand-set brightness (see durchgangszimmer_manual_override)
          - condition: state
            entity_id: input_boolean.durchgangszimmer_keep_on
            state: "off"
        sequence:
          - service: light.turn_on
            target:
              entity_id:
                - light.durchgangszimmer1
                - light.durchgangszimmer2
            data:
              brightness_pct: 100
              transition: 3
mode: single
