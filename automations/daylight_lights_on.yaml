# Daylight Lights On
#
# When it gets dark again (illuminance drops below 30 lux),
# turn on lights in occupied rooms.
#
id: daylight_lights_on
alias: Daylight Lights On
description: Turn on lights in occupied rooms when it gets dark again
triggers:
  - entity_id: sensor.bewegungssensor2_licht_illuminance
    below: 30
    for:
      minutes: 2
    trigger: numeric_state
  - entity_id: sun.sun
    attribute: elevation
    below: 3
    trigger: numeric_state
conditions:
  - condition: state
    entity_id: input_boolean.keep_lights_on
    state: "off"
  - condition: not
    conditions:
      - condition: time
        after: "22:30:00"
        before: "07:00:00"
actions:
  # Wohnzimmer: if occupied, turn on lights
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor3_presence
            state: "on"
          # Don't stomp a hand-set brightness (see wohnzimmer_manual_override)
          - condition: state
            entity_id: input_boolean.wohnzimmer_keep_on
            state: "off"
          # Wohnzimmer only turns on when genuinely dark — tighter than the global
          # < 30 lux / sun < 3° trigger, which fired here while it was still bright
          # (it stays light at the windows during summer evenings).
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.bewegungssensor2_licht_illuminance
                below: 20
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                below: 0
        sequence:
          - service: light.turn_on
            target:
              entity_id: light.wohnzimmerlampe
            data:
              brightness_pct: 100
              transition: 3
          - service: light.turn_on
            target:
              entity_id:
                - light.vintage_lampe
                - light.stehlampe
            data:
              brightness_pct: 40
              transition: 3
  # Küche: if occupied, turn on light
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor_presence
            state: "on"
        sequence:
          - service: light.turn_on
            target:
              entity_id: light.kuchenlampe
            data:
              brightness_pct: 100
              transition: 3
  # Durchgangszimmer: if occupied, turn on lights
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.praesenzsensor2_presence
            state: "on"
        sequence:
          - service: light.turn_on
            target:
              entity_id:
                - light.durchgangszimmer1
                - light.durchgangszimmer2
            data:
              brightness_pct: 100
              transition: 3
mode: single
