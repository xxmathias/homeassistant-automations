id: turn_off_everything_on_6h_no_motion
alias: Turn OFF everything when 6h no motion
description: ""
triggers:
  # Original trigger: presence changes to off for 6 hours
  - entity_id: binary_sensor.praesenzsensor_presence
    to: "off"
    for:
      hours: 6
    trigger: state
  # Periodic check: every hour, in case presence was already off when lights turned on
  - trigger: time_pattern
    hours: "/1"
conditions:
  # Require ALL presence/motion sensors clear for 6h, so a single occupied room
  # (e.g. sitting in the durchgangszimmer/Kreativzimmer) blocks the all-off.
  - condition: state
    entity_id: binary_sensor.praesenzsensor_presence # kitchen
    state: "off"
    for:
      hours: 6
  - condition: state
    entity_id: binary_sensor.praesenzsensor3_presence # wohnzimmer
    state: "off"
    for:
      hours: 6
  - condition: state
    entity_id: binary_sensor.praesenzsensor2_presence # durchgangszimmer/Kreativzimmer
    state: "off"
    for:
      hours: 6
  - condition: state
    entity_id: binary_sensor.bewegungssensor2_licht_occupancy # entrance/pathway traffic
    state: "off"
    for:
      hours: 6
  - condition: state
    entity_id: binary_sensor.bewegungssensor1_occupancy # entrance/bathroom
    state: "off"
    for:
      hours: 6
actions:
  - action: script.turn_off_all
  # Turn off Yamaha boxes (not assigned to an area)
  - action: switch.turn_off
    target:
      entity_id:
        - switch.box_left
        - switch.box_right
mode: single
