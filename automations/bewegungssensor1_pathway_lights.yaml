id: bewegungssensor1_pathway_lights
alias: Bewegungssensor1 Pathway Lights
description: Turn on pathway + entrance lights when motion detected by bewegungssensor1
triggers:
  - entity_id: binary_sensor.bewegungssensor1_occupancy
    to: "on"
    trigger: state
    id: motion_on
  - entity_id: binary_sensor.bewegungssensor1_occupancy
    to: "off"
    trigger: state
    id: motion_off
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: numeric_state
            entity_id: sensor.bewegungssensor2_licht_illuminance
            below: 30
          - condition: not
            conditions:
              - condition: time
                after: "22:30:00"
                before: "07:00:00"
        sequence:
          # Turn on entrance at full brightness
          - service: light.turn_on
            target:
              area_id: entrance
            data:
              transition: 3
              brightness_pct: 100
          # Turn on durchgangszimmer as pathway (preserve higher brightness if already
          # on) — skipped while a hand-set brightness is held: the |max only preserves
          # levels above 60%, so a hand-set 30% would still get pushed up
          # (see durchgangszimmer_manual_override)
          - if:
              - condition: state
                entity_id: input_boolean.durchgangszimmer_keep_on
                state: "off"
            then:
              - service: light.turn_on
                target:
                  entity_id:
                    - light.durchgangszimmer1
                    - light.durchgangszimmer2
                data:
                  transition: 3
                  brightness_pct: >
                    {% if is_state('light.durchgangszimmer1', 'off') and
                    is_state('light.durchgangszimmer2', 'off') %}
                      60
                    {% else %}
                      {% set brightness1 = state_attr('light.durchgangszimmer1', 'brightness')|int(0) %}
                      {% set brightness2 = state_attr('light.durchgangszimmer2', 'brightness')|int(0) %}
                      {% set current_pct = ([brightness1, brightness2]|max / 255 * 100)|round(0) %}
                      {{ [current_pct, 60]|max }}
                    {% endif %}
          # Turn on kitchen at 50% only if no presence detected (boosts to 100% on presence)
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor_presence
                    state: "off"
                sequence:
                  # Billy first, kuchenlampe 1s later
                  - service: light.turn_on
                    target:
                      entity_id: light.billy_tischleuchte
                    data:
                      transition: 3
                      brightness_pct: 50
                  - delay:
                      seconds: 1
                  - service: light.turn_on
                    target:
                      entity_id: light.kuchenlampe
                    data:
                      transition: 3
                      brightness_pct: 50
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: state
            entity_id: input_boolean.keep_lights_on
            state: "off"
        sequence:
          # Wait 60 seconds before turning off
          - delay:
              seconds: 60
          # Check if still no motion
          - condition: state
            entity_id: binary_sensor.bewegungssensor1_occupancy
            state: "off"
          # Turn off kitchen only if at pathway brightness (≤62%), not if presence automation set it higher
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor_presence
                    state: "off"
                  - condition: template
                    value_template: >
                      {% set k = state_attr('light.kuchenlampe', 'brightness')|int(0) %}
                      {% set b = state_attr('light.billy_tischleuchte', 'brightness')|int(0) %}
                      {{ ([k, b]|max / 255 * 100)|round(0) <= 62 }}
                sequence:
                  # Ceiling light off first, billy 1s later
                  - service: light.turn_off
                    target:
                      entity_id: light.kuchenlampe
                    data:
                      transition: 3
                  - delay:
                      seconds: 1
                  - service: light.turn_off
                    target:
                      entity_id: light.billy_tischleuchte
                    data:
                      transition: 3
          # Turn off durchgangszimmer only if no presence there — and never while a
          # hand-set brightness is held (see durchgangszimmer_manual_override). This
          # path is exactly the failure mode the hold exists for: praesenzsensor2
          # drops when you sit still, so entrance traffic would strand your level off.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.praesenzsensor2_presence
                    state: "off"
                    for:
                      minutes: 5
                  - condition: state
                    entity_id: input_boolean.durchgangszimmer_keep_on
                    state: "off"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id:
                        - light.durchgangszimmer1
                        - light.durchgangszimmer2
                    data:
                      transition: 3
                  - service: switch.turn_off
                    target:
                      entity_id: switch.afrika_stehlampe
          # Entrance needs longer timeout - wait another 2min (3min total)
          - delay:
              seconds: 120
          - condition: state
            entity_id: binary_sensor.bewegungssensor1_occupancy
            state: "off"
          - condition: state
            entity_id: binary_sensor.bewegungssensor2_licht_occupancy
            state: "off"
          # Turn off entrance lights
          - service: light.turn_off
            target:
              area_id: entrance
            data:
              transition: 3
mode: restart
